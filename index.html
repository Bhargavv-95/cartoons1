<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:linear-gradient(90deg,#ff6b6b,#feca57);
    padding:20px;
    text-align:center;
    color:white;
}

header h1{
    font-size:45px;
}

nav{
    background:#333;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
    transition:0.3s;
}

nav a:hover{
    color:#feca57;
}

.hero{
    height:500px;
    background:url('https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1200') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero h2{
    font-size:55px;
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:10px;
}

.section{
    padding:50px 20px;
    text-align:center;
}

.section h2{
    margin-bottom:30px;
    font-size:40px;
    color:#333;
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

.card{
    background:white;
    width:280px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h3{
    padding:15px;
}

.contact{
    background:#ff9f43;
    color:white;
    padding:50px 20px;
}

.contact input,
.contact textarea{
    width:80%;
    padding:12px;
    margin:10px;
    border:none;
    border-radius:8px;
}

.contact button{
    padding:12px 30px;
    border:none;
    background:#333;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:768px){
    .hero h2{
        font-size:35px;
    }

    .cards{
        flex-direction:column;
        align-items:center;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎬 Cartoon World</h1>
    <p>Fun Unlimited for Kids & Cartoon Lovers</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Cartoons</a>
    <a href="#">Videos</a>
    <a href="#">Gallery</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h2>Welcome to Cartoon World 🌈</h2>
</section>

<section class="section">
    <h2>Popular Cartoons</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1000">
            <h3>Funny Cartoon</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?q=80&w=1000">
            <h3>Adventure Cartoon</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?q=80&w=1000">
            <h3>Kids Cartoon</h3>
        </div>

    </div>
</section>

<section class="contact">
    <h2>Contact Us</h2>

    <input type="text" placeholder="Your Name"><br>
    <input type="email" placeholder="Your Email"><br>
    <textarea rows="5" placeholder="Your Message"></textarea><br>

    <button>Send Message</button>
</section>

<footer>
    <p>© 2026 Cartoon World | All Rights Reserved</p>
</footer>

</body>
